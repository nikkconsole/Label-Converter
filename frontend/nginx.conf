server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # Cache control: content-hashed Vite assets (e.g., main.a1b2c3d4.js)
    location ~* "\.[a-f0-9]{8}\." {
        add_header Cache-Control "max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No-cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API proxy to backend service
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        error_page 502 = @backend_unavailable;
    }

    # Named location: 502 fallback with JSON body
    location @backend_unavailable {
        default_type application/json;
        return 502 '{"error": "Backend unavailable"}';
    }

    # SPA fallback: serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
